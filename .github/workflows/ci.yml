name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          for f in index.js client.js channels.js transport.js; do
            node --check "$f"
          done
          for f in selftest.mjs client-smoke.mjs integration.mjs list-channels.mjs; do
            node --check "$f"
          done

      - name: Structural self-test (offline)
        run: node selftest.mjs

      - name: Browser half smoke test (offline)
        run: node client-smoke.mjs

      - name: Channel inventory
        run: node list-channels.mjs
